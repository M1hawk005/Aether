name: Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: src/daemon-go/go.mod
        cache-dependency-path: src/daemon-go/go.sum
    - name: Test daemon
      working-directory: src/daemon-go
      run: go test ./...

  sdk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: packages/sdk/package-lock.json
    - name: Install dependencies
      working-directory: packages/sdk
      run: npm ci
    - name: Test SDK
      working-directory: packages/sdk
      run: npm test

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: aether-docs/package-lock.json
    - name: Install dependencies
      working-directory: aether-docs
      run: npm ci
    - name: Build documentation
      working-directory: aether-docs
      run: npm run build
